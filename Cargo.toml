[package]
name = "lindaflor"
version = "0.1.0"
edition = "2024"
default-run = "lindaflor"

[dependencies]
topcoat = { version = "0.9", features = ["tailwind", "ui", "icon-iconify", "multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "time", "uuid"] }
redis = { version = "0.28", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
rand = "0.8"
http = "1"
argon2 = { version = "0.6.0", features = ["alloc", "password-hash", "getrandom"] }
password-hash = { version = "0.6.1", features = ["alloc", "getrandom", "phc"] }
hex = "0.4.3"
hmac = "0.12"
sha2 = "0.10"
time = "0.3.55"
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth", "gen_secret"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }

[build-dependencies]
topcoat = { version = "0.9", default-features = false, features = ["tailwind", "icon-iconify"] }

[dev-dependencies]
postgresql_embedded = { version = "0.21", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# Faster incremental links for `topcoat dev` (see Topcoat getting started).
[profile.dev]
debug = "line-tables-only"

[package]
name = "test-support"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
lindaflor = { path = "../.." }
postgresql_embedded = { version = "0.21", features = ["tokio"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "uuid"] }
tokio = { version = "1", features = ["full"] }
topcoat = { version = "0.9" }
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth", "gen_secret"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

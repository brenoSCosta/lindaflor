# sqlc: `make generate` (or `sqlc generate`). Generated code is committed;
# CI fails when it drifts from db/queries + db/migrations.
#
# One query file per feature area (db/queries/<area>.sql) so parallel work
# never edits the same file. See docs/GO_MIGRATION.md.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_interface: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
          # Nullable marker domains (db/migrations/00002_*): sqlc types every
          # computed expression (scalar subquery, CASE, aggregate) as NOT
          # NULL; cast one that may be NULL to null_<type> to get a pointer.
          - db_type: null_text
            go_type:
              type: string
              pointer: true
          - db_type: null_int4
            go_type:
              type: int32
              pointer: true
          - db_type: null_int8
            go_type:
              type: int64
              pointer: true
          - db_type: null_bool
            go_type:
              type: bool
              pointer: true
          - db_type: null_uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: null_timestamptz
            go_type:
              import: time
              type: Time
              pointer: true

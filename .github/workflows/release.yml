name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get PR number for commit
        id: pr
        run: |
          pr_num=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.after }}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          echo "number=${pr_num:-0}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create changesets from conventional commits
        id: create
        run: |
          output=$(bun run .github/scripts/create-changeset.ts 2>&1)
          echo "$output"
          echo "changesets_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit and push changesets to release branch
        if: contains(steps.create.outputs.changesets_output, 'CHANGESETS_CREATED')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_BRANCH="changeset-release/main"
          git fetch origin "$RELEASE_BRANCH" 2>/dev/null || true
          if git show-ref --quiet "refs/remotes/origin/$RELEASE_BRANCH"; then
            git checkout "$RELEASE_BRANCH"
            git merge origin/main --no-edit -X ours
          else
            git checkout -b "$RELEASE_BRANCH"
          fi
          git add .changeset/*.md
          git diff --staged --quiet || git commit -m "chore(release): add changesets from conventional commits"
          git push origin HEAD:"$RELEASE_BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout release branch for version/PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_BRANCH="changeset-release/main"
          git fetch origin "$RELEASE_BRANCH" 2>/dev/null || true
          if git show-ref --quiet "refs/remotes/origin/$RELEASE_BRANCH"; then
            git checkout "$RELEASE_BRANCH"
            git merge origin/main --no-edit -X ours
          else
            git checkout -b "$RELEASE_BRANCH"
          fi

      - name: Check for unreleased changesets
        id: changesets
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print 2>/dev/null | wc -l)
          echo "has_unreleased=$([ "$count" -gt 0 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request
        if: steps.changesets.outputs.has_unreleased == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_BRANCH="changeset-release/main"
          bun run version
          git add -A
          git diff --staged --quiet || git commit -m "ci: release"
          git push origin HEAD:"$RELEASE_BRANCH" --force
          if [ -z "$(gh pr list --head "$RELEASE_BRANCH" --base main --state open)" ]; then
            gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "ci: release" \
              --body "Version packages. Merge to update package versions and changelogs."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current branch
        run: echo "CURRENT_BRANCH=$(git branch --show-current)" >> $GITHUB_ENV

      - name: Update lock file
        if: env.CURRENT_BRANCH == 'changeset-release/main'
        run: bun install

      - name: Commit lock file
        if: env.CURRENT_BRANCH == 'changeset-release/main'
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          branch: ${{ env.CURRENT_BRANCH }}
          commit_message: "chore: update lock file"

  snapshot:
    name: Snapshot Release
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish snapshot
        run: |
          bun run version -- --snapshot next
          bun run publish -- --tag next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

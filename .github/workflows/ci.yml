# Go CI. Every Go job runs inside the flake dev shell (`nix develop`), so CI
# uses exactly the toolchain developers do: go 1.27.3, templ, sqlc,
# golangci-lint v2, tailwindcss 4, postgres 17 (tests start their own
# server from the shell's initdb/postgres), govulncheck, hadolint,
# actionlint, shellcheck.
name: CI

on:
  push:
    branches: [main, migration, migration-golang]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: lint (golangci-lint, sqlc vet, templ fmt, infra)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-
      - name: Toolchain
        run: nix develop -c bash -c 'go version && templ version && sqlc version && golangci-lint version'
      - name: golangci-lint + sqlc vet + templ fmt
        run: nix develop -c make lint
      - name: go vet
        run: nix develop -c go vet ./...
      - name: hadolint + shellcheck + actionlint
        run: nix develop -c make lint-infra

  generate:
    name: generated code is current (templ, sqlc, tailwind)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-${{ runner.os }}-
      - run: nix develop -c make generate
      - name: No drift
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  test:
    name: test (race)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-race-${{ runner.os }}-
      - name: go build
        run: nix develop -c go build ./...
      # testutil starts one Postgres per test binary from the shell's
      # initdb/postgres (LINDAFLOR_TEST_PG=local fails fast instead of
      # falling back to a downloaded embedded server).
      - name: go test -race
        env:
          LINDAFLOR_TEST_PG: local
        run: nix develop -c go test -race -count=1 ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - run: nix develop -c govulncheck ./...

  nix:
    name: nix build (vendorHash current)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#default
      - run: test -x result/bin/server && test -x result/bin/create-admin && test -x result/bin/seed

  docker:
    name: docker (build, compose config, boot smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          # Debian package versions are not pinned (security updates win).
          ignore: DL3008
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: lindaflor:ci
          load: true
          push: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          tags: lindaflor-migrate:ci
          load: true
          push: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
      - name: Compose file is valid
        env:
          APP_ORIGIN: https://ci.invalid
          MAIL_FROM: Lindaflor <ci@lindaflor.invalid>
        run: |
          mkdir -p secrets
          for s in postgres_password database_url valkey_password valkey_url \
            s3_access_key s3_secret_key token_pepper totp_encryption_key metrics_token; do
            echo ci > "secrets/$s"
          done
          docker compose -f docker-compose.prod.yml --profile ops config --quiet
      - name: Boot smoke (migrate + backup jobs, web /api/readyz, HEALTHCHECK)
        run: scripts/docker-smoke.sh lindaflor:ci lindaflor-migrate:ci
